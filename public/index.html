<html lang="ko">
<head>
<meta charset="utf-8">

<title>TM Timer - 포모도로 기법, 공부 타이머, 효율적인 공부 타이머</title>
<meta name="description" content="25분 공부·5분 휴식을 자동으로 반복하는 무료 포모도로 타이머. 4회마다 긴 휴식, 전환 알림음, 다른 창 위에 띄우는 미니 타이머, 오늘의 세계 공부 순위. 한국어·English·日本語·中文 지원.">
<meta property="og:title" content="TM Timer - 포모도로 기법, 공부 타이머, 효율적인 공부 타이머">
<meta property="og:description" content="25분 공부·5분 휴식을 자동으로 반복하는 무료 포모도로 타이머. 4회마다 긴 휴식, 전환 알림음, 다른 창 위에 띄우는 미니 타이머, 오늘의 세계 공부 순위. 한국어·English·日本語·中文 지원.">
<meta property="og:type" content="website">
<meta name="google-site-verification" content="ETppSoEdnNys6bcgo0uFKv6rq9r2bAw35aHeZm3G8tQ">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@700&family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>
body{margin:0}
/* 레이아웃: 3열 — 왼쪽 진행 방식 / 가운데 다이얼 / 오른쪽 시간 설정. 좁으면 다이얼 먼저 한 열로 */
:root{
  --bg:#ffffff; --surface:#f3f8f4; --fg:#16271d; --muted:#6a7c71; --line:#e1ebe4;
  --study:#1e8e4e; --rest:#6cc08a; --long:#0e7c72;
  --accent:var(--study); --accent-ink:#ffffff; --accent-soft:#e3f3e8;
  --display:"Bricolage Grotesque","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Yu Gothic UI","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
body[data-mode="rest"]{--accent:var(--rest);--accent-ink:#0f2a19;--accent-soft:#eef8f1}
body[data-mode="long"]{--accent:var(--long);--accent-ink:#ffffff;--accent-soft:#e2f2f0}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px) minmax(0,1fr);gap:28px 40px;align-items:start}
.timer{display:flex;flex-direction:column;align-items:center;gap:22px;min-width:0}
@media (max-width:1020px){.wrap{grid-template-columns:minmax(0,1fr);max-width:520px}.timer{order:1}.leftcol{order:2}.setup{order:3}}
header.top{grid-column:1/-1;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px;color:var(--study)}
h1 .leaf{width:22px;height:22px}
.ghost{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.hdr-r{display:flex;gap:8px;align-items:center;justify-self:end}
.tabs{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:8px 18px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--study)}
.tabs button[aria-selected="true"]{background:var(--study);color:#fff}
@media (max-width:640px){header.top{grid-template-columns:1fr auto}.tabs{grid-column:1/-1;order:3;justify-self:center}}
select.lang{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
select.lang:focus-visible{outline:2px solid var(--study);outline-offset:2px}
.ghost:hover{border-color:var(--study);color:var(--study)}

.phases{display:flex;gap:6px;font-size:14px;font-weight:600;flex-wrap:wrap;justify-content:center}
.phases span{padding:6px 14px;border-radius:999px;color:var(--muted);background:var(--surface);transition:background .3s,color .3s}
.phases span.on{background:var(--accent);color:var(--accent-ink)}

.dial{position:relative;width:min(100%,360px);aspect-ratio:1;max-width:100%}
.dial svg{width:100%;height:100%;display:block}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.time{font-family:var(--mono);font-weight:700;font-size:clamp(52px,15vw,76px);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.sub{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--study)}

.controls{display:flex;gap:10px;align-items:center}
.big{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;font-family:var(--display);font-weight:800;font-size:20px;padding:14px 0;width:160px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000);transition:transform .08s,box-shadow .08s,background .3s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.round:hover{border-color:var(--study);color:var(--study)}
.round svg{width:20px;height:20px}
button:focus-visible,input:focus-visible{outline:2px solid var(--study);outline-offset:2px}

.pip{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid transparent;color:var(--fg);border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:background .3s}
.pip:hover{border-color:var(--study)}
.pip svg{width:18px;height:18px;color:var(--study)}
.note{font-size:13px;color:var(--muted);text-align:center;max-width:42ch;min-height:1.5em}
.hint{font-size:12px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface)}



.panel{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--bg);display:flex;flex-direction:column;gap:16px;min-width:0;margin-top:52px}
@media (max-width:1020px){.panel{margin-top:0}}
.panel h2{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin:0;color:var(--study)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:st}
ol.steps li{counter-increment:st;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;line-height:1.55}
ol.steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--study);font-family:var(--mono);font-weight:700;font-size:13px;display:grid;place-items:center}
ol.steps b{color:var(--study)}
.cyc{display:flex;flex-direction:column;gap:8px}
.cyc-bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden}
.cyc-bar i{display:block;min-width:3px}
.cyc-bar .s{background:var(--study)} .cyc-bar .r{background:var(--rest)} .cyc-bar .l{background:var(--long)}
.cyc-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.cyc-legend span{display:inline-flex;align-items:center;gap:6px}
.cyc-legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.cyc-total{font-size:13px;color:var(--fg);font-weight:600}
.cyc-total small{font-family:var(--mono);color:var(--study);font-size:13px}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0;padding-top:0}
.row.off{opacity:.4}
.row label{font-size:14px;font-weight:600}
.row .u{font-size:12px;color:var(--muted);min-width:3.5em}
.num{display:flex;align-items:center;gap:6px}
.num button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--study);font:700 16px var(--mono);cursor:pointer;line-height:1}
.num button:hover:not(:disabled){border-color:var(--study);background:var(--accent-soft)}
.num button:disabled{cursor:default}
input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=number]{width:58px;font-family:var(--mono);font-weight:700;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=range]{width:130px;padding:0;accent-color:var(--study);background:none;border:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--study);margin:0}
.presets{display:flex;flex-direction:column;gap:8px}
.presets .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.presets .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 13px var(--mono);cursor:pointer}
.chip:hover{border-color:var(--study)}
.chip[aria-pressed="true"]{background:var(--study);border-color:var(--study);color:#fff}
.small-note{font-size:12px;color:var(--muted);margin:0}
.leftcol{display:flex;flex-direction:column;gap:20px;min-width:0;margin-top:52px}
.leftcol .panel{margin-top:0}
@media (max-width:1020px){.leftcol{margin-top:0}}
.kw-dial{width:100%;max-width:150px;aspect-ratio:1;margin:0 auto;user-select:none;-webkit-user-select:none;pointer-events:none}
.kw-dial svg{width:100%;height:100%;display:block;overflow:visible}
.kw-words text{fill:var(--study);font-family:var(--body);font-size:11px;font-weight:600}
.kw-ring{fill:none;stroke:var(--accent-soft);stroke-width:6}
.kw-ticks line{stroke:var(--study);stroke-linecap:round;opacity:.55}
.kw-hand{stroke:var(--study);stroke-width:3;stroke-linecap:round}
.kw-hand.thin{stroke-width:2;opacity:.7}
.kw-pin{fill:var(--study)}
body[data-view="rank"] .leftcol,body[data-view="rank"] .timer,body[data-view="rank"] .setup{display:none}
.rankview{display:none}
body[data-view="rank"] .rankview{display:flex}
.rankview{grid-column:1/-1;width:100%;max-width:980px;margin:0 auto;flex-direction:column;gap:20px;min-width:0}
.rank-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.rank-head h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;color:var(--study);text-wrap:balance}
.rank-sub{margin:4px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank-me{display:flex;justify-content:space-between;align-items:center;gap:16px 24px;flex-wrap:wrap;background:var(--accent-soft);border-radius:16px;padding:18px 22px}
.me-stats{display:flex;gap:28px;flex-wrap:wrap}
.me-stats div{display:flex;flex-direction:column;gap:2px}
.me-stats .k{font-size:12px;color:var(--muted)}
.me-stats b{font-family:var(--mono);font-size:24px;color:var(--fg);font-variant-numeric:tabular-nums}
.me-need{flex-basis:100%;order:3;margin:0;font-size:13px;font-weight:600;color:var(--study)}
.name-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name-form label{font-size:13px;font-weight:600}
.name-form input{width:170px;background:var(--bg)}
.primary{background:var(--study);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.rank-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:800px){.rank-cols{grid-template-columns:minmax(0,1fr)}}
.rank-card{border:1px solid var(--line);border-radius:16px;padding:18px 18px 10px;min-width:0}
.rank-card h3{font-family:var(--display);font-size:17px;margin:0 0 8px;color:var(--study)}
ol.board{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}
.board li{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--line);font-size:14px;border-radius:8px}
.board li:first-child{border-top:0}
.board .pos{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--muted);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.board li.r1 .pos{background:var(--study);color:#fff}
.board li.r2 .pos{background:var(--rest);color:#0f2a19}
.board li.r3 .pos{background:var(--accent-soft);color:var(--study)}
.board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.board .cc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.board .mm{font-family:var(--mono);font-weight:700;color:var(--study);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.board li.mine{background:var(--accent-soft)}
.board li.mine .nm::after{content:attr(data-me);margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:var(--study);border-radius:999px;padding:1px 7px}
.board .empty{display:block;color:var(--muted);font-size:13px;padding:14px 4px;border:0}
.rank-note{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--study);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
#pipVideo{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">

nt-baseline="middle" text-anchor="end" opacity=".62">study with me</text><text x="92" y="150" transform="rotate(360.0 150 150)" dominant-baseline="middle" text-anchor="end" opacity="1">勉強法</text><text x="92" y="150" transform="rotate(375.0 150 150)" dominant-baseline="middle" text-anchor="end" opacity=".62">在线番茄钟</text><text x="92" y="150" transform="rotate(390.0 150 150)" dominant-baseline="middle" text-anchor="end" opacity="1">25분 타이머</text><text x="92" y="150" transform="rotate(405.0 150 150)" dominant-baseline="middle" text-anchor="end" opacity=".62">productivity</text><text x="92" y="150" transform="rotate(420.0 150 150)" dominant-baseline="middle" text-anchor="end" opacity="1">タイマーアプリ</text><text x="92" y="150" transform="rotate(435.0 150 150)" dominant-baseline="middle" text-anchor="end" opacity=".62">学习打卡</text>

      people.innerHTML = '';
      d.top.forEach((r, i) => people.appendChild(li((i < 3 ? 'r' + (i + 1) : '') + (r.mine ? ' mine' : ''),
        [['pos', i + 1], ['nm', r.name], ['cc', regionName(r.country)], ['mm', fmtDur(r.minutes)]], r.mine)));
      people.querySelectorAll('li.mine .nm').forEach(n => n.dataset.me = t('meTag'));
    }
    if (!d.countries.length) emptyRow(ctry, t('emptyRank'));
    else {
      ctry.innerHTML = '';
      d.countries.forEach((c, i) => ctry.appendChild(li(i < 3 ? 'r' + (i + 1) : '',
        [['pos', i + 1], ['nm', regionName(c.country)], ['cc', t('peopleN', { n: c.people })], ['mm', fmtDur(c.minutes)]])));
    }
  }

  function setView(v){
    document.body.dataset.view = v;
    $('tab-timer').setAttribute('aria-selected', v === 'timer');
    $('tab-rank').setAttribute('aria-selected', v === 'rank');
    if (v === 'rank') loadRanking();
  }
  $('tab-timer').onclick = () => setView('timer');
  $('tab-rank').onclick = () => setView('rank');
  $('rankRefresh').onclick = loadRanking;
  setInterval(() => { if (document.body.dataset.view === 'rank' && !document.hidden) loadRanking(); }, 60000);
  $('nick').value = nick;
  $('nameForm').addEventListener('submit', async e => {
    e.preventDefault();
    const n = $('nick').value.replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16);
    if (!n) return;
    nick = n; $('nick').value = n; store.set('nick', n);
    try { await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: uid, name: nick, minutes: 0 }) }); } catch {}
    toast(t('nameSaved')); loadRanking();
  });
  reportStudy();
  setView(location.hash === '#ranking' ? 'rank' : 'timer');

  $('lang').addEventListener('change', e => { lang = e.target.value; store.set('lang', lang); applyLang(); });

  setMode('study');
  fillSetup();
  applyLang();
})();
</script>

</body>
</html>
